_defaults: &defaults
  root: /g/data/qv56/replicas
  activity_id: input4MIPs
  mip_era: CMIP7
  target_mip: ScenarioMIP
  institution_id: IIASA-IAMC
  realm: atmos
  frequency: mon
  grid_label: gn
  dataset_category: emissions
  # Emission filenames spell variable_id with hyphens (BC_em_anthro ->
  # BC-em-anthro), while the directory name keeps the underscores.
  hyphenate_variable: true
  time_range: 202201-210012

_ext_defaults: &ext_defaults
  <<: *defaults
  time_range: 210501-250012

# For each scenario <s>:
#   <s>          surface emissions (stream -1-1-1), 2022-2100
#   <s>-ext      surface emissions extension, 2105-2500
#   <s>-air      aircraft emissions (stream -1-1-2), 2022-2100
#   <s>-air-ext  aircraft emissions extension, 2105-2500

h:
  <<: *defaults
  source_id: IIASA-IAMC-h-1-1-1
  version: v20260409

