[mypy]
# Static type checking for the DRS dataset layer and the generator scripts
# that use it. Generator modules import each other as top-level modules
# (e.g. "from dataset import DatasetConfig", "from ghg.cmip7_ghg import ..."),
# so module names are resolved relative to esm1p6_ancil.
mypy_path = CMIP7/esm1p6/ancil/lib/python/esm1p6_ancil
explicit_package_bases = True
# iris, ants, cftime, f90nml etc. are only available on Gadi.
ignore_missing_imports = True
follow_imports = silent
