repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-toml
    -   id: name-tests-test
    -   id: debug-statements
# Run linter and formatter.
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 'v0.12.4'
    hooks:
    # Run the linter
    -   id: ruff-check
        types_or: [ python, pyi ] # Exclude jupyter notebooks
        args: ['--fix']
    -   id: ruff-format
        types_or: [ python, pyi ] # Exclude jupyter notebooks
# Static type checking of the DRS dataset layer and the generators using it.
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
    -   id: mypy
        files: ^CMIP7/esm1p6/ancil/lib/python/esm1p6_ancil/(dataset\.py|ghg/|nitrogen/)
        additional_dependencies: [types-PyYAML]